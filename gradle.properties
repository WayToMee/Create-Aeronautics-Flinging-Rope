# Mod
mod_id=ropes
mod_name=Create Aeronautics: Flinging Rope
mod_author=WayToMee
mod_version=0.3.0
mod_group_id=dev.waytomee.flingingrope
mod_description=A throwable rope coil running entirely on the Create: Aeronautics stack — Sable rope physics with Create: Simulated's rope systems and visuals. Fling a free rope, wind it in, let teammates grab the end.
license=MIT

# Java
java_version=21

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# NeoForge — https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.228
neoforge_loader_version_range=[4,)

# Parchment Mappings — https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21
parchment_version=2024.11.10

# The Aeronautics stack (hard dependencies), from https://maven.ryanhcode.dev/releases
simulated_version=1.3.1
sable_version=2.0.5
veil_version=4.3.2

# Create stack (Simulated's own dependency versions)
create_version=6.0.10-280
ponder_version=1.0.81
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true